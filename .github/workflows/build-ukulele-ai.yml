name: Build Ukulele AI APK

on:
  push:
    branches: [ukulele-ai-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build debug APK
        working-directory: ukulele-ai
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          ls -lh ukulele-ai/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ukulele-ai/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ukulele-ai-studio-0.8-karaoke-debug-apk
          path: ukulele-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
